[tool.poetry]
name = "ecomart-fastapi"
version = "0.1.0"
description = "A multi-tenant e-commerce platform API built with FastAPI."
authors = ["Your Name <youremail@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.75.0"
uvicorn = "^0.17.0"
sqlalchemy = "^1.4.27"
alembic = "^1.7.5"
redis = "^4.0.2"
celery = "^5.2.0"
pydantic = "^1.9.0"
httpx = "^0.21.0"
python-dotenv = "^0.19.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"